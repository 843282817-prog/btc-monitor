name: BTC Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *' # 每小时自动运行一次

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pandas numpy

      - name: Run Script
        run: python monitor.py
